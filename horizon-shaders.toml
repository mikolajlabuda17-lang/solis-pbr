# --- Settings Pages ---
[[pages]]
id = "main"
name = "Solis PBR"
items = [
    "page:lighting",
    "page:sky_atmo",
    "page:astronomy",
    "page:the_end",
    "page:nether",
    "page:water",
    "page:materials_rain",
    "page:camera_grade",
    "tonemap_operator"
]

[[pages]]
id = "astronomy"
name = "Zjawiska Astronomiczne"
description = "Spektakle nieba: Halo 22° (1200), Zacmienie Slonca (5800), Wielka Kometa (13200), Supernowa i Meteory (15500), Krwawy Ksiezyc (18000), Burza G5 (20500) i Tecza."
items = [
    "ice_halos_enabled",
    "solar_eclipse",
    "great_comet_enabled",
    "supernova_enabled",
    "meteors_enabled",
    "lunar_eclipse",
    "g5_aurora_storm",
    "rainbow_enabled"
]

[[pages]]
id = "the_end"
name = "End i Czarna Dziura"
description = "Relatywistyczna czarna dziura Gargantua (soczewkowanie grawitacyjne, dysk akrecyjny, efekt Dopplera) i oswietlenie Endu."
items = [
    "end_black_hole",
    "end_bh_size",
    "end_disk_intensity",
    "end_doppler_shift",
    "end_ambient_light"
]

[[pages]]
id = "nether"
name = "Wulkaniczny Nether"
description = "Fizyczna skorupa lawy 1580K, wolumetryczny popiol biomowy, polysk GGX bazaltu i falowanie goracego powietrza."
items = [
    "nether_overhaul",
    "nether_lava_glow",
    "nether_fog_density",
    "nether_heat_haze"
]

[[pages]]
id = "lighting"
name = "Oswietlenie i Cienie"
description = "Cienie slonca/ksiezyca PCF, kolorowe szklo, SSAO, kolorowe swiatlo blokow i swiecace rudy."
items = [
    "shadows_enabled",
    "shadow_resolution",
    "shadow_distance",
    "shadow_softness",
    "colored_shadows",
    "ssao_enabled",
    "ssao_strength",
    "block_light_intensity",
    "emissive_ores",
    "ore_glow_strength"
]

[[pages]]
id = "sky_atmo"
name = "Niebo, Chmury i Mgla"
description = "Fizyczne rozpraszanie Rayleigh/Mie, slonce, ksiezyc, chmury wolumetryczne, promienie sloneczne i mgla."
items = [
    "celestial_size",
    "stars_enabled",
    "volumetric_clouds",
    "cloud_quality",
    "cloud_coverage",
    "cirrus_clouds",
    "godrays_enabled",
    "godrays_strength",
    "fog_density",
    "aurora_enabled"
]

[[pages]]
id = "water"
name = "Woda i Podwoda"
description = "Fale Gerstnera, odbicia lustrzane, refrakcja, absorpcja swiatla, kaustyka i piana przy brzegu."
items = [
    "water_reflections",
    "water_wave_height",
    "water_clarity",
    "caustics_strength",
    "shore_foam",
    "water_refraction"
]

[[pages]]
id = "materials_rain"
name = "PBR, Deszcz i Wiatr"
description = "Obsluga LabPBR, geometryczny relief, kaluze w deszczu, odbicia SSR i falowanie roslinnosci."
items = [
    "labpbr_enabled",
    "pom_displacement",
    "specular_strength",
    "rain_puddles",
    "puddle_coverage",
    "wet_ssr",
    "wind_enabled",
    "wind_strength"
]

[[pages]]
id = "camera_grade"
name = "Kamera i Kolory"
description = "Ekspozycja, HDR bloom, flara sloneczna, kontrast, nasycenie, winieta oraz wygladzanie FXAA."
items = [
    "exposure",
    "auto_exposure",
    "bloom_enabled",
    "bloom_strength",
    "sun_flare",
    "contrast",
    "saturation",
    "vibrance",
    "vignette_strength",
    "fxaa_enabled"
]

# --- Options (35 total, all mapped to pages & WGSL overrides) ---
[[options]]
id = "shadows_enabled"
name = "Cienie Slonca/Ksiezyca"
description = "Wlacza mape cieni kierunkowych dla terenu i bytow."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Rozdzielczosc Cieni"
description = "Rozmiar mapy cieni w tekselach. Wyzsze wartosci daja ostrzejsze krawedzie cieni."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Zasieg Cieni"
description = "Polowa boku obszaru pokrytego mapa cieni (w blokach)."
type = "choice"
values = ["96", "128", "160", "224"]
default = "160"

[[options]]
id = "shadow_softness"
name = "Miekkosc Cieni (PCF)"
description = "Promien rozmycia krawedzi cieni filtrem Vogla PCF."
type = "float"
default = 1.25
min = 0.25
max = 3.0
step = 0.25

[[options]]
id = "colored_shadows"
name = "Kolorowe Cienie Szkla"
description = "Swiatlo przechodzace przez witraze, lod i wode barwi cienie."
type = "bool"
default = true

[[options]]
id = "ssao_enabled"
name = "Cieniowanie Zakamarkow (SSAO)"
description = "Wlacza okluzje otoczenia w przestrzeni ekranu dla glebszych rogow i lasow."
type = "bool"
default = true

[[options]]
id = "ssao_strength"
name = "Sila SSAO"
description = "Intensywnosc przyciemnienia zakamarkow przez SSAO."
type = "float"
default = 0.75
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "block_light_intensity"
name = "Jasnosc Swiatla Blokow"
description = "Wzmocnienie cieplych pochodni, latarni, ognia dusz i redstone."
type = "float"
default = 1.15
min = 0.5
max = 2.5
step = 0.05

[[options]]
id = "emissive_ores"
name = "Swiecace Rudy (Emissive Ores)"
description = "Sprawia, ze zyly mineralow w rudach diamentu, szmaragdu, zlota i redstone delikatnie swieca w ciemnosci."
type = "bool"
default = true

[[options]]
id = "ore_glow_strength"
name = "Moc Swiecenia Rud"
description = "Jasnosc emisji zyl mineralow na blokach rud."
type = "float"
default = 1.2
min = 0.2
max = 3.0
step = 0.1

[[options]]
id = "solar_eclipse"
name = "Calkowite Zacmienie Slonca (5800)"
description = "Pelne fizyczne zacmienie slonca z korona sloneczna, protuberancjami i pierscieniem zmierzchu o czasie 5800."
type = "bool"
default = true
resets = "view"

[[options]]
id = "celestial_size"
name = "Skala Slonca i Ksiezyca"
description = "Rozmiar katowy fizycznej tarczy slonca i ksiezyca na niebie."
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "stars_enabled"
name = "Gwiazdy Nocnego Nieba"
description = "Proceduralne, obracajace sie gwiazdy o naturalnej temperaturze barwowej i subtelnym migotaniu."
type = "bool"
default = true

[[options]]
id = "volumetric_clouds"
name = "Chmury Wolumetryczne 3D"
description = "Raymarchowane chmury cumulus z rozpraszaniem Mie, samocieniowaniem i wygladzaniem czasowym."
type = "bool"
default = true
resets = "view"

[[options]]
id = "cloud_quality"
name = "Jakosc Chmur"
description = "Liczba probek raymarchingu chmur wolumetrycznych."
type = "choice"
values = ["Szybka", "Zbalansowana", "Wysoka"]
default = "Wysoka"
resets = "view"

[[options]]
id = "cloud_coverage"
name = "Zachmurzenie"
description = "Ilosc chmur na niebie w bezdeszczowa pogode (deszcz automatycznie zwieksza pokrycie)."
type = "float"
default = 0.48
min = 0.15
max = 0.85
step = 0.02
resets = "view"

[[options]]
id = "cirrus_clouds"
name = "Wysokie Chmury Cirrus"
description = "Dodaje delikatne pierzaste chmury na duzej wysokosci."
type = "bool"
default = true

[[options]]
id = "godrays_enabled"
name = "Promienie Sloneczne (God Rays)"
description = "Wolumetryczne snopy swiatla slonecznego i ksiezycowego przez drzewa i chmury."
type = "bool"
default = true

[[options]]
id = "godrays_strength"
name = "Sila God Rays"
description = "Intensywnosc wolumetrycznych promieni swiatla."
type = "float"
default = 0.85
min = 0.1
max = 2.0
step = 0.05

[[options]]
id = "fog_density"
name = "Gestosc Mgly Atmosferycznej"
description = "Skaluje fizyczna perspektywe powietrzna i poranna/deszczowa mgle."
type = "float"
default = 1.0
min = 0.2
max = 2.5
step = 0.1

[[options]]
id = "aurora_enabled"
name = "Zorza Polarna w Nocnych Biomach"
description = "Subtelna zorza polarna na nocnym niebie w chlodnych biomach."
type = "bool"
default = true

[[options]]
id = "water_reflections"
name = "Lustrzane Odbicia w Wodzie"
description = "Renderuje odbicie swiata na tafli wody polaczone z odbiciem nieba (Fresnel)."
type = "bool"
default = true

[[options]]
id = "water_wave_height"
name = "Wysokosc Fal Wody"
description = "Amplituda fal Gerstnera na powierzchni wody."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Przejrzystosc Wody"
description = "Kontroluje zasieg absorpcji swiatla Beera-Lamberta w glebokiej wodzie."
type = "float"
default = 1.0
min = 0.3
max = 2.2
step = 0.1

[[options]]
id = "caustics_strength"
name = "Sila Kaustyki Podwodnej"
description = "Intensywnosc ruchomej siatki swiatla slonecznego na dnie zbiornikow wodnych."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "shore_foam"
name = "Piana Przybrzezna"
description = "Delikatna biala piana na plytkiej wodzie przy krawedziach blokow."
type = "bool"
default = true

[[options]]
id = "water_refraction"
name = "Refrakcja Podwodna"
description = "Znieksztalcenie obrazu dna przez fale na powierzchni wody."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "labpbr_enabled"
name = "Obsluga Paczek LabPBR"
description = "Uzywa map normalnych (_n) i specular (_s) z zainstalowanego resource packa."
type = "bool"
default = true

[[options]]
id = "pom_displacement"
name = "Geometryczny Relief (Displacement)"
description = "Wypukly, rzucajacy cienie relief geometryczny blisko kamery dla tekstur LabPBR."
type = "bool"
default = true

[[options]]
id = "specular_strength"
name = "Sila Połysku PBR"
description = "Intensywnosc odbic mikro-powierzchniowych GGX na metalach, kamieniu i mokrych blokach."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "rain_puddles"
name = "Mokry Teren i Kaluze w Deszczu"
description = "Podczas opadow odsłoniety teren ciemnieje, nabiera polysku, tworzy kaluze i kregi kropel."
type = "bool"
default = true

[[options]]
id = "puddle_coverage"
name = "Ilosc Kaluz"
description = "Pokrycie plaskich powierzchni kaluzami podczas deszczu."
type = "float"
default = 0.60
min = 0.1
max = 1.0
step = 0.05

[[options]]
id = "wet_ssr"
name = "Odbicia Ekranowe (SSR) na Mokrym"
description = "Odbicia drzew, budynkow i pochodni w kaluzach i na gladkich polerowanych blokach."
type = "bool"
