schema = 1
id = "solis_pbr"
name = "Solis PBR"
version = "1.1.5"
api = "0.2"
description = "Realistic physically-based PBR shaderpack for Horizon: Rayleigh/Mie sky, Solar Eclipse (5800), Lunar Eclipse (18000), 22° Ice Halo & Sundogs (1200), Great Comet (13200), Supernova & Meteors (15500), G5 Corona Aurora (20500), Double Rainbow, End Gargantua Black Hole, Volcanic Nether & AgX."
authors = ["mikolajlabuda17-lang"]
license = "MIT"
shared = ["lib/common.wgsl"]

[budget]
gpu_ms = 5.5

[frame]
blend = "linear"
fog = "pack"

[sky]
file = "sky.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Physical Sky, Astronomy & Gargantua"
clouds = false
sun = false
moon = false
stars = false

[shadow]
resolution = 2048
distance = 160.0
solid_materials = [10]
option = "shadows_enabled"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "water_reflections"

[displacement]
distance = 12.0
cells = 16
option = "pom_displacement"

[vertex]
file = "vertex.wgsl"
name = "Wind & Waves"

[material]
file = "material.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/lighting.wgsl", "lib/nether_volcanic.wgsl", "lib/water.wgsl"]
name = "PBR Terrain, Lava & Water"

[entity]
file = "entity.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/lighting.wgsl", "lib/nether_volcanic.wgsl"]
name = "PBR Entities"

[weather]
file = "weather.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Atmospheric Weather"

[[resource]]
name = "atmo_half"
format = "rgba16float"
scale = 0.5
keep = "view"

[[post]]
file = "post/clouds_ssao.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Volumetric Clouds & SSAO"
output = "atmo_half"
reads = ["atmo_half_previous"]

[[post]]
file = "post/godrays.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Volumetric Light Shafts"
output = "shafts_quarter"
scale = 0.25

[[post]]
file = "post/composite.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Atmosphere, Heat Haze & SSR"
reads = ["atmo_half"]

[[post]]
file = "post/bloom.wgsl"
name = "HDR Bloom Pyramid"
output = "bloom_quarter"
scale = 0.25

[[post]]
file = "post/grade_fxaa.wgsl"
files = ["lib/astronomy.wgsl", "lib/atmosphere.wgsl", "lib/end_gargantua.wgsl", "lib/nether_volcanic.wgsl"]
name = "Lens, Grade & FXAA"

[tonemap]
file = "tonemap.wgsl"
name = "AgX / ACES Display Transform"

[[textures]]
id = "noise_tex"
file = "textures/noise.png"
filter = "linear"
wrap = "repeat"

# --- Sprite tags (bit flags in input.tags) ---
[[tags]]
id = "glass"
sprites = ["block/glass", "block/*_stained_glass", "block/tinted_glass", "block/*_stained_glass_pane_top", "block/glass_pane_top"]

[[tags]]
id = "ice_surface"
sprites = ["block/ice", "block/packed_ice", "block/blue_ice", "block/frosted_ice_*"]

[[tags]]
